[project]
name = "imgtool"
description = "MCUboot's image signing and key management"
requires-python = ">=3.6"
license = "Apache-2.0"
authors = [{ name = "The MCUboot committers", email = "mcuboot@groups.io" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "cbor2",
  "click",
  "cryptography>=40.0.0",
  "intelhex>=2.2.1",
  "pyyaml",
]
dynamic = ["version"]

[project.urls]
Homepage = "http://github.com/mcu-tools/mcuboot"
Repository = "http://github.com/mcu-tools/mcuboot"

[project.scripts]
imgtool = "imgtool.main:imgtool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["imgtool/*"]

[tool.hatch.version]
path = "imgtool/__init__.py"
pattern = "imgtool_version = \"(?P<version>[^']+)\""
